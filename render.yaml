services:
  - type: web
    name: enterprise-document-intelligence
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run ui.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_CHAT_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        sync: false